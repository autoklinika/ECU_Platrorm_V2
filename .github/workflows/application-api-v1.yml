name: Application API V1 (read-only)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecu-api-v1-${{github.ref }}
  cancel-in-progress: false

jobs:
  api-linux:
    name: API Linux (${{matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cxx: g++
          - compiler: clang
            cxx: clang++
    env:
      CXX: ${{matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable API and Linux adapter
        run: >
          cmake -S . -B build/api-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DECU_BUILD_APPLICATION_API=ON
      - name: Build
        run: cmake --build build/api-ci --target ecu_api_http ecu_application_api_tests --parallel 2
      - name: Test authentication, DTO and HTTP fail-closed cases
        run: ctest --test-dir build/api-ci -R '^ecu[.]api[.]' --output-on-failure

  api-windows:
    name: API Windows MSVC (${{matrix.arch }} / ${{matrix.config }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure portable API (no Linux adapters)
        shell: pwsh
        run: >
          cmake -S . -B "build/api-ci-${{matrix.arch }}-${{matrix.config }}"
          -G "Visual Studio 17 2022" -A "${{matrix.arch }}"
          -DECU_BUILD_APPLICATION_API=ON
          -DECU_BUILD_LINUX_V2_PLATFORM=OFF
      - name: Build
        shell: pwsh
        run: >
          cmake --build "build/api-ci-${{matrix.arch }}-${{matrix.config }}"
          --config "${{matrix.config }}"
          --target ecu_api_http ecu_application_api_tests
      - name: Test
        shell: pwsh
        run: >
          ctest --test-dir "build/api-ci-${{matrix.arch }}-${{matrix.config }}"
          -C "${{matrix.config }}" -R '^ecu[.]api[.]'
          --output-on-failure
