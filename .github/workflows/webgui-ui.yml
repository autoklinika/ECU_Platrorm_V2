name: WebGUI presentation and localization

on:
  push:
    paths:
      - "webgui/**"
      - "docs/WEBGUI_HOME_V1_I18N.md"
      - "docs/CM5_WEBGUI_KIOSK_DEPLOYMENT_V1.md"
      - "deploy/webgui/**"
      - "scripts/install_cm5_webgui_v1.sh"
      - "scripts/deploy_cursor_css_cm5.sh"
      - "scripts/fix_cm5_ghost_pointer.sh"
      - "scripts/probe_cm5_wayland_sandbox.sh"
      - "tests/test_webgui_install_contract.py"
      - ".github/workflows/webgui-ui.yml"
  pull_request:
    paths:
      - "webgui/**"
      - "docs/WEBGUI_HOME_V1_I18N.md"
      - "docs/CM5_WEBGUI_KIOSK_DEPLOYMENT_V1.md"
      - "deploy/webgui/**"
      - "scripts/install_cm5_webgui_v1.sh"
      - "scripts/deploy_cursor_css_cm5.sh"
      - "scripts/fix_cm5_ghost_pointer.sh"
      - "scripts/probe_cm5_wayland_sandbox.sh"
      - "tests/test_webgui_install_contract.py"
      - ".github/workflows/webgui-ui.yml"

permissions:
  contents: read

jobs:
  webgui-contract:
    name: Static WebGUI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check webgui/src/app.mjs
          node --check webgui/src/i18n.mjs
          node --check webgui/src/domain-text.mjs
      - name: Client-only, navigation and translation tests
        run: node --test webgui/tests/i18n.test.mjs webgui/tests/contract.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static deployment and HTTP security tests
        run: python -m unittest discover -s tests -p test_webgui_install_contract.py -v
      - name: Bash installer syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/install_cm5_webgui_v1.sh
          bash -n scripts/deploy_cursor_css_cm5.sh
          bash -n scripts/fix_cm5_ghost_pointer.sh
          bash -n scripts/probe_cm5_wayland_sandbox.sh
          bash -n deploy/webgui/rollback_kiosk.sh
          bash -n deploy/webgui/ecu-kiosk-v1-launcher
