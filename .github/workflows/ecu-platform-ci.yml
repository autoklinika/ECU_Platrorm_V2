name: ECU Platform CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ecu-platform-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-linux:
    name: Core Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Standards and scoped conformance gate
        run: bash scripts/check_core_standards.sh --require-conformance

      - name: Architecture gate
        run: bash scripts/check_core_architecture.sh

      - name: Portability gate
        run: bash scripts/check_core_portability.sh

      - name: Full Core hardening validation
        run: bash scripts/validate_core_hardening.sh

      - name: Core V2 foundation validation
        run: bash scripts/validate_core_v2_foundation.sh

  core-v2-clang-linux:
    name: Core V2 Linux Clang
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Core V2 foundation validation
        run: bash scripts/validate_core_v2_foundation.sh

  core-v2-windows-msvc:
    name: Core V2 Windows MSVC (${{ matrix.arch }} / ${{ matrix.config }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - Win32
        config:
          - Debug
          - Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Core V2 scoped conformance gate
        shell: pwsh
        run: python scripts/check_core_v2_conformance.py

      - name: Architecture gate
        shell: pwsh
        run: python scripts/check_core_v2_architecture.py src/core_v2

      - name: Configure Core V2 only
        shell: pwsh
        run: >
          cmake -S . -B "build/core-v2-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          -G "Visual Studio 17 2022"
          -A "${{ matrix.arch }}"
          -DECU_BUILD_TESTS=ON
          -DECU_BUILD_LEGACY_CORE=OFF
          -DECU_BUILD_SAC_MODULE=OFF
          -DECU_BUILD_LINUX_SOCKETCAN=OFF
          -DECU_BUILD_CORE_V2=ON
          -DECU_BUILD_BENCH_RUNTIME=OFF

      - name: Build
        shell: pwsh
        run: >
          cmake --build "build/core-v2-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --target ecu_core_v2_tests

      - name: Test
        shell: pwsh
        run: >
          ctest --test-dir "build/core-v2-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          -C "${{ matrix.config }}"
          -R "^ecu\.core_v2\."
          --output-on-failure
          --no-tests=error

  bench-runtime-linux:
    name: Bench Runtime Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      - name: Configure Bench Runtime
        run: >
          cmake -S . -B build/bench-runtime-linux -G Ninja
          -DECU_BUILD_TESTS=ON
          -DECU_BUILD_LEGACY_CORE=OFF
          -DECU_BUILD_SAC_MODULE=OFF
          -DECU_BUILD_LINUX_SOCKETCAN=OFF
          -DECU_BUILD_CORE_V2=ON
          -DECU_BUILD_BENCH_RUNTIME=ON
      - name: Build
        run: cmake --build build/bench-runtime-linux --target ecu_bench_tests
      - name: Test
        run: >
          ctest --test-dir build/bench-runtime-linux
          -R '^ecu\.bench\.'
          --output-on-failure
          --no-tests=error

  bench-runtime-clang-linux:
    name: Bench Runtime Linux Clang
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build clang
      - name: Configure Bench Runtime
        run: >
          cmake -S . -B build/bench-runtime-clang -G Ninja
          -DECU_BUILD_TESTS=ON
          -DECU_BUILD_LEGACY_CORE=OFF
          -DECU_BUILD_SAC_MODULE=OFF
          -DECU_BUILD_LINUX_SOCKETCAN=OFF
          -DECU_BUILD_CORE_V2=ON
          -DECU_BUILD_BENCH_RUNTIME=ON
      - name: Build
        run: cmake --build build/bench-runtime-clang --target ecu_bench_tests
      - name: Test
        run: >
          ctest --test-dir build/bench-runtime-clang
          -R '^ecu\.bench\.'
          --output-on-failure
          --no-tests=error

  bench-runtime-windows-msvc:
    name: Bench Runtime Windows MSVC (${{ matrix.arch }} / ${{ matrix.config }})
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - Win32
        config:
          - Debug
          - Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Bench Runtime
        shell: pwsh
        run: >
          cmake -S . -B "build/bench-runtime-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          -G "Visual Studio 17 2022"
          -A "${{ matrix.arch }}"
          -DECU_BUILD_TESTS=ON
          -DECU_BUILD_LEGACY_CORE=OFF
          -DECU_BUILD_SAC_MODULE=OFF
          -DECU_BUILD_LINUX_SOCKETCAN=OFF
          -DECU_BUILD_CORE_V2=ON
          -DECU_BUILD_BENCH_RUNTIME=ON
      - name: Build
        shell: pwsh
        run: >
          cmake --build "build/bench-runtime-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          --config "${{ matrix.config }}"
          --target ecu_bench_tests
      - name: Test
        shell: pwsh
        run: >
          ctest --test-dir "build/bench-runtime-msvc-${{ matrix.arch }}-${{ matrix.config }}"
          -C "${{ matrix.config }}"
          -R "^ecu\.bench\."
          --output-on-failure
          --no-tests=error